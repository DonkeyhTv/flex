name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — style, lint, unit and e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The real app on PGlite: PostgreSQL in WebAssembly, with the real migrations.
      - run: npm run test:e2e

  web:
    name: Web — lint, unit tests, build in three languages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx ng test --watch=false
      # Fails on a message missing from a translation.
      - run: npx ng build

  e2e:
    name: Production images — browser tests and Lighthouse
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Start the production stack
        working-directory: deploy
        run: |
          cat > .env <<ENV
          DATABASE_PASSWORD=$(openssl rand -hex 12)
          TRUST_PROXY_HOPS=1
          SIGN_IN_LIMIT=1000
          ENV
          docker compose up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Playwright, with axe-core accessibility checks
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8092
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.16.0 autorun
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
