# Development: PostgreSQL only. Run the API and the web app with npm (see the README).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flex
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: flex
    ports:
      - '5434:5432'
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flex -d flex']
      interval: 2s
      retries: 30

volumes:
  db:
