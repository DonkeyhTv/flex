# The three builds (fr, nl, en) and the API behind one origin: the session
# cookie and the CSP stay simple, and there is no CORS at all.

map $http_accept_language $flex_locale {
    default fr;
    ~*^nl   nl;
    ~*^en   en;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative redirects: behind the host's nginx, this server knows neither the scheme nor the port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/headers.conf;

    # Only the sign-in pages have anything to show a search engine; the rest needs an account.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *
Allow: /fr/sign-in
Allow: /nl/sign-in
Allow: /en/sign-in
Disallow: /
";
    }

    # The visitor's language, from the browser.
    location = / {
        include /etc/nginx/headers.conf;
        add_header Vary "Accept-Language" always;
        return 302 /$flex_locale/;
    }

    # Files with a hash in their name never change: cache them for a year.
    location ~* ^/(fr|nl|en)/.+\.(js|css|woff2|woff)$ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fr/ { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache" always; try_files $uri $uri/ /fr/index.html; }
    location /nl/ { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache" always; try_files $uri $uri/ /nl/index.html; }
    location /en/ { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache" always; try_files $uri $uri/ /en/index.html; }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Server-sent events: no buffering, a long timeout, and the header that
    # tells the host's nginx not to buffer either.
    location = /api/events {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
    }

    location / {
        return 302 /$flex_locale$request_uri;
    }
}
